name: Windows Defender Real-Time Protection Failure/Restart
id: dd80db93-6ec2-4f4c-a017-ad40da6ffe81
version: 1
schema_version: "1.0"
date: "2023-05-05"
author: Nasreddine Bencherchali (Nextron Systems), Christopher Peacock '@securepeacock' (Update)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dd80db93-6ec2-4f4c-a017-ad40da6ffe81
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects issues with Windows Defender Real-Time Protection features. MITRE
  ATT&CK: T1685.

data_source:
  - Windows Defender Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "3002"
              - term:
                  data_win_system_eventID: "3007"
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_feature_Name"
        - exists:
            field: "data_win_eventdata_reason"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_feature_Name: "%%886"
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_reason: "%%892"
                          - term:
                              data_win_eventdata_reason: "%%858"
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_feature_Name
    - data_win_eventdata_reason

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '3002'; data_win_system_eventID
  equals '3007'; data_win_eventdata_feature_Name equals '%%886', among other
  conditions.

known_false_positives: >
  Some crashes can occur sometimes and the event doesn't provide enough
  information to tune out these cases. Manual exception is required. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - Internal Research
  - https://www.microsoft.com/en-us/security/blog/2023/04/11/guidance-for-investigating-attacks-using-cve-2022-21894-the-blacklotus-campaign/
  - https://gist.github.com/nasbench/33732d6705cbdc712fae356f07666346
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Real-Time Protection Failure/Restart detected on host
    $agent_name$. Matched data_win_eventdata_feature_Name:
    $data_win_eventdata_feature_Name$. Matched data_win_eventdata_reason:
    $data_win_eventdata_reason$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_feature_Name
      type: other
    - field: data_win_eventdata_reason
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - protection
    - failure
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"3002" OR data_win_system_eventID:"3007") AND _exists_:data_win_eventdata_feature_Name AND _exists_:data_win_eventdata_reason AND NOT (data_win_eventdata_feature_Name:"%%886" AND (data_win_eventdata_reason:"%%892" OR data_win_eventdata_reason:"%%858"))
