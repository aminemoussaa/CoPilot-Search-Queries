name: Commvault QLogin Argument Injection Authentication Bypass (CVE-2025-57791)
id: ff0225a0-1d9a-4bae-ab26-6038b18bb6d4
version: 1
schema_version: "1.0"
date: "2025-10-20"
author: X__Junior (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ff0225a0-1d9a-4bae-ab26-6038b18bb6d4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of argument injection in the Commvault qlogin command -
  potential exploitation for CVE-2025-57791. An attacker can inject the
  `-localadmin` parameter via the password field to bypass authentication and
  gain a privileged token. MITRE ATT&CK: T1190.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*qlogin*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -cs *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -localadmin*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -clp *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*_localadmin__*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*qlogin*'; data_win_eventdata_commandLine matches '* -cs *';
  data_win_eventdata_commandLine matches '* -localadmin*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.watchtowr.com/guess-who-would-be-stupid-enough-to-rob-the-same-vault-twice-pre-auth-rce-chains-in-commvault/
  - https://attack.mitre.org/techniques/T1190/

response:
  message: >
    Commvault QLogin Argument Injection Authentication Bypass (CVE-2025-57791)
    detected on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1190
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
  custom_tags:
    - commvault
    - qlogin
    - argument
    - process_creation
    - sysmon
    - initial_access
    - emerging_threats
    - cve_2025_57791
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Qq][Ll][Oo][Gg][Ii][Nn].*/ AND data_win_eventdata_commandLine:/.* -[Cc][Ss] .*/ AND data_win_eventdata_commandLine:/.* -[Ll][Oo][Cc][Aa][Ll][Aa][Dd][Mm][Ii][Nn].*/ AND data_win_eventdata_commandLine:/.* -[Cc][Ll][Pp] .*/ AND data_win_eventdata_commandLine:/.*_[Ll][Oo][Cc][Aa][Ll][Aa][Dd][Mm][Ii][Nn]__.*/
