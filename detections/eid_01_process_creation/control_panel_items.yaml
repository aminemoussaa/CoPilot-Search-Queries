name: Control Panel Items
id: 0ba863e6-def5-4e50-9cea-4dd8c7dc46a4
version: 1
schema_version: "1.0"
date: "2023-10-11"
author: Kyaw Min Thein, Furkan Caliskan (@caliskanfurkan_)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0ba863e6-def5-4e50-9cea-4dd8c7dc46a4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the malicious use of a control panel item. MITRE ATT&CK: T1218.002,
  T1546.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\reg.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "reg.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*add*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*CurrentVersion\\\\Control Panel\\\\CPLs*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.cpl"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_commandLine"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*\\\\System32\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*%System%*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*|C:\\\\Windows\\\\system32|*"
                                      case_insensitive: true
                                - bool:
                                    must:
                                      - wildcard:
                                          data_win_eventdata_commandLine:
                                            value: "*regsvr32 *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_win_eventdata_commandLine:
                                            value: "* /s *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_win_eventdata_commandLine:
                                            value: "*igfxCPL.cpl*"
                                            case_insensitive: true
                              minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '*add*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://ired.team/offensive-security/code-execution/code-execution-through-control-panel-add-ins
  - https://attack.mitre.org/techniques/T1218/002/
  - https://attack.mitre.org/techniques/T1546/

response:
  message: >
    Control Panel Items detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218.002, T1546
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.002
    - T1546
  custom_tags:
    - control
    - panel
    - items
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Cc][Pp][Ll][Ss].*/) OR (data_win_eventdata_commandLine:/.*\.[Cc][Pp][Ll]/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_commandLine:/.*%[Ss][Yy][Ss][Tt][Ee][Mm]%.*/ OR data_win_eventdata_commandLine:/.*\|[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\|.*/ OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32 .*/ AND data_win_eventdata_commandLine:/.* \/[Ss] .*/ AND data_win_eventdata_commandLine:/.*[Ii][Gg][Ff][Xx][Cc][Pp][Ll]\.[Cc][Pp][Ll].*/))))
