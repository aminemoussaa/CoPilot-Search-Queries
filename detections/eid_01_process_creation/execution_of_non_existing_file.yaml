name: Execution Of Non-Existing File
id: 71158e3f-df67-472b-930e-7d287acaa3e1
version: 1
schema_version: "1.0"
date: "2026-07-05"
author: Max Altgelt (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 71158e3f-df67-472b-930e-7d287acaa3e1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process creation events where the Image field lacks an absolute path,
  which occurs when the backing file no longer exists on disk at the time of
  logging - commonly caused by Process Ghosting or other unorthodox process
  creation techniques. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image: "*\\\\*"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                    - term:
                        data_win_eventdata_image: "-"
                    - term:
                        data_win_eventdata_image: ""
                    - term:
                        data_win_eventdata_image:
                          value: "MemCompression"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "Registry"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "System"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "vmmem"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "vmmemWSL"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_commandLine:
                          value: "MemCompression"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_commandLine:
                          value: "Registry"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_commandLine:
                          value: "vmmem"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_commandLine:
                          value: "vmmemWSL"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\*';
  data_win_eventdata_image is absent; data_win_eventdata_image equals '-', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlaboratories.com/2021/12/08/process-ghosting/
  - https://www.elastic.co/blog/process-ghosting-a-new-executable-image-tampering-attack
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Execution Of Non-Existing File detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - existing
    - process_creation
    - sysmon
    - stealth
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (NOT _exists_:data_win_eventdata_image OR data_win_eventdata_image:"-" OR data_win_eventdata_image:"" OR data_win_eventdata_image:/[Mm][Ee][Mm][Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]/ OR data_win_eventdata_image:/[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]/ OR data_win_eventdata_image:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_image:/[Vv][Mm][Mm][Ee][Mm]/ OR data_win_eventdata_image:/[Vv][Mm][Mm][Ee][Mm][Ww][Ss][Ll]/ OR data_win_eventdata_commandLine:/[Mm][Ee][Mm][Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]/ OR data_win_eventdata_commandLine:/[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]/ OR data_win_eventdata_commandLine:/[Vv][Mm][Mm][Ee][Mm]/ OR data_win_eventdata_commandLine:/[Vv][Mm][Mm][Ee][Mm][Ww][Ss][Ll]/)
