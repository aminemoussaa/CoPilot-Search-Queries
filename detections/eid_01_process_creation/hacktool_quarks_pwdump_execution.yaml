name: HackTool - Quarks PwDump Execution
id: 0685b176-c816-4837-8e7b-1216f346636b
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0685b176-c816-4837-8e7b-1216f346636b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the Quarks PwDump tool via commandline arguments. MITRE
  ATT&CK: T1003.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\QuarksPwDump.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " -dhl"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " --dump-hash-local"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " -dhdc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " --dump-hash-domain-cached"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " --dump-bitlocker"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " -dhd "
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " --dump-hash-domain "
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: "--ntds-file"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\QuarksPwDump.exe'; data_win_eventdata_commandLine equals ' -dhl';
  data_win_eventdata_commandLine equals ' --dump-hash-local', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/quarkslab/quarkspwdump
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/seedworm-apt-iran-middle-east
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    HackTool - Quarks PwDump Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - hacktool
    - quarks
    - pwdump
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Qq][Uu][Aa][Rr][Kk][Ss][Pp][Ww][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/ -[Dd][Hh][Ll]/ OR data_win_eventdata_commandLine:/ --[Dd][Uu][Mm][Pp]-[Hh][Aa][Ss][Hh]-[Ll][Oo][Cc][Aa][Ll]/ OR data_win_eventdata_commandLine:/ -[Dd][Hh][Dd][Cc]/ OR data_win_eventdata_commandLine:/ --[Dd][Uu][Mm][Pp]-[Hh][Aa][Ss][Hh]-[Dd][Oo][Mm][Aa][Ii][Nn]-[Cc][Aa][Cc][Hh][Ee][Dd]/ OR data_win_eventdata_commandLine:/ --[Dd][Uu][Mm][Pp]-[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr]/ OR data_win_eventdata_commandLine:/ -[Dd][Hh][Dd] / OR data_win_eventdata_commandLine:/ --[Dd][Uu][Mm][Pp]-[Hh][Aa][Ss][Hh]-[Dd][Oo][Mm][Aa][Ii][Nn] / OR data_win_eventdata_commandLine:/--[Nn][Tt][Dd][Ss]-[Ff][Ii][Ll][Ee]/)
