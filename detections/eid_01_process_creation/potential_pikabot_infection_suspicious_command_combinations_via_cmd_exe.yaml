name: Potential Pikabot Infection - Suspicious Command Combinations Via Cmd.EXE
id: e5144106-8198-4f6e-bfc2-0a551cc8dd94
version: 1
schema_version: "1.0"
date: "2024-01-02"
author: Alejandro Houspanossian ('@lekz86')
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e5144106-8198-4f6e-bfc2-0a551cc8dd94
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of concatenated commands via "cmd.exe". Pikabot often
  executes a combination of multiple commands via the command handler "cmd /c"
  in order to download and execute additional payloads. Commands such as "curl",
  "wget" in order to download extra payloads. "ping" and "timeout" are abused to
  introduce delays in the command execution and "Rundll32" is also used to
  execute malicious DLL files. In the observed Pikabot infections, a combination
  of the commands described above are used to orchestrate the download and
  execution of malicious DLL files. MITRE ATT&CK: T1059.003, T1105, T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*cmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/c*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "* & *"
              - wildcard:
                  data_win_eventdata_commandLine: "* || *"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* curl*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* wget*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* timeout *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ping *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* rundll32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* mkdir *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*cmd*'; data_win_eventdata_commandLine matches '*/c*';
  data_win_eventdata_commandLine matches '* & *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/pr0xylife/Pikabot/blob/7f7723a74ca325ec54c6e61e076acce9a4b20538/Pikabot_30.10.2023.txt
  - https://github.com/pr0xylife/Pikabot/blob/7f7723a74ca325ec54c6e61e076acce9a4b20538/Pikabot_22.12.2023.txt
  - https://attack.mitre.org/techniques/T1059/003/
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential Pikabot Infection - Suspicious Command Combinations Via Cmd.EXE
    detected on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.003, T1105, T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
    - T1105
    - T1218
  custom_tags:
    - pikabot
    - infection
    - combinations
    - process_creation
    - sysmon
    - command_and_control
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*/ AND data_win_eventdata_commandLine:/.*\/[Cc].*/ AND (data_win_eventdata_commandLine:/.* \& .*/ OR data_win_eventdata_commandLine:/.* \|\| .*/) AND (data_win_eventdata_commandLine:/.* [Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.* [Ww][Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.* [Tt][Ii][Mm][Ee][Oo][Uu][Tt] .*/ OR data_win_eventdata_commandLine:/.* [Pp][Ii][Nn][Gg] .*/) AND (data_win_eventdata_commandLine:/.* [Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_commandLine:/.* [Mm][Kk][Dd][Ii][Rr] .*/)
