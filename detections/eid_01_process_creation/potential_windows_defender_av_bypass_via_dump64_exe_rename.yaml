name: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
id: 129966c9-de17-4334-a123-8b58172e664d
version: 1
schema_version: "1.0"
date: "2024-06-21"
author: Austin Songer @austinsonger, Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 129966c9-de17-4334-a123-8b58172e664d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a user is potentially trying to bypass the Windows Defender AV by
  renaming a tool to dump64.exe and placing it in the Visual Studio folder.
  Currently the rule is covering only usage of procdump but other utilities can
  be added in order to increase coverage. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: ":\\\\Program Files*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Microsoft Visual Studio\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\dump64.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "procdump"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ma *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -mp *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches ':\Program
  Files*'; data_win_eventdata_image matches '*\Microsoft Visual Studio\*';
  data_win_eventdata_image matches '*\dump64.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/mrd0x/status/1460597833917251595
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential Windows Defender AV Bypass Via Dump64.EXE Rename detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - defender
    - bypass
    - dump64
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss].*/ AND data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ii][Ss][Uu][Aa][Ll] [Ss][Tt][Uu][Dd][Ii][Oo]\\.*/ AND data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]/ AND (data_win_eventdata_originalFileName:/[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]/ OR data_win_eventdata_commandLine:/.* -[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* -[Mm][Pp] .*/)
