name: PUA - Advanced Port Scanner Execution
id: 54773c5f-f1cc-4703-9126-2f797d96a69d
version: 1
schema_version: "1.0"
date: "2023-02-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 54773c5f-f1cc-4703-9126-2f797d96a69d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Advanced Port Scanner. MITRE ATT&CK: T1046, T1135.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\advanced_port_scanner*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*advanced_port_scanner*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "*Advanced Port Scanner*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/portable*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/lng*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\advanced_port_scanner*'; data_win_eventdata_originalFileName matches
  '*advanced_port_scanner*'; data_win_eventdata_description matches '*Advanced
  Port Scanner*', among other conditions.

known_false_positives: >
  Legitimate administrative use. Tools with similar commandline (very rare).
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Other/Advanced%20Port%20Scanner
  - https://attack.mitre.org/techniques/T1046/
  - https://attack.mitre.org/techniques/T1135/

response:
  message: >
    PUA - Advanced Port Scanner Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1046, T1135
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
    - T1135
  custom_tags:
    - advanced
    - scanner
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Pp][Oo][Rr][Tt]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_originalFileName:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Pp][Oo][Rr][Tt]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_description:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd] [Pp][Oo][Rr][Tt] [Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR (data_win_eventdata_commandLine:/.*\/[Pp][Oo][Rr][Tt][Aa][Bb][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*\/[Ll][Nn][Gg].*/))
