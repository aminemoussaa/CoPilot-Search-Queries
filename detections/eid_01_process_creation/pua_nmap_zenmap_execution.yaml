name: PUA - Nmap/Zenmap Execution
id: f6ecd1cf-19b8-4488-97f6-00f0924991a3
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f6ecd1cf-19b8-4488-97f6-00f0924991a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of namp/zenmap. Adversaries may attempt to get a listing of
  services running on remote hosts, including those that may be vulnerable to
  remote software exploitation. MITRE ATT&CK: T1046.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\nmap.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\zennmap.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "nmap.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "zennmap.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\nmap.exe'; data_win_eventdata_image matches '*\zennmap.exe';
  data_win_eventdata_originalFileName equals 'nmap.exe', among other conditions.

known_false_positives: >
  Legitimate administrator activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://nmap.org/
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1046/T1046.md#atomic-test-3---port-scan-nmap-for-windows
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    PUA - Nmap/Zenmap Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1046
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
  custom_tags:
    - zenmap
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Zz][Ee][Nn][Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Zz][Ee][Nn][Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/)
