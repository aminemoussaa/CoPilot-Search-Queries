name: Rundll32 Execution Without Parameters
id: 5bb68627-3198-40ca-b458-49f973db8752
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: Bartlomiej Czyz, Relativity
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5bb68627-3198-40ca-b458-49f973db8752
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects rundll32 execution without parameters as observed when running
  Metasploit windows/smb/psexec exploit module. MITRE ATT&CK: T1021.002, T1570,
  T1569.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_commandLine:
                    value: "rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: "rundll32"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine equals
  'rundll32.exe'; data_win_eventdata_commandLine equals 'rundll32'.

known_false_positives: >
  False positives may occur if a user called rundll32 from CLI with no options.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://bczyz1.github.io/2021/01/30/psexec.html
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1570/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Rundll32 Execution Without Parameters detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1021.002, T1570, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1570
    - T1569.002
  custom_tags:
    - rundll32
    - parameters
    - process_creation
    - sysmon
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/[Rr][Uu][Nn][Dd][Ll][Ll]32/)
