name: Suspicious File Characteristics Due to Missing Fields
id: 9637e8a5-7131-4f7f-bdc7-2b05d8670c43
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Markus Neis, Sander Wiebing
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9637e8a5-7131-4f7f-bdc7-2b05d8670c43
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Executables in the Downloads folder without
  FileVersion,Description,Product,Company likely created with py2exe. MITRE
  ATT&CK: T1059.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_description: "?"
                    - term:
                        data_win_eventdata_fileVersion: "?"
              - bool:
                  must:
                    - term:
                        data_win_eventdata_description: "?"
                    - term:
                        data_win_eventdata_product: "?"
              - bool:
                  must:
                    - term:
                        data_win_eventdata_description: "?"
                    - term:
                        data_win_eventdata_company: "?"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Downloads\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_fileVersion
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals '?';
  data_win_eventdata_fileVersion equals '?'; data_win_eventdata_description
  equals '?', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/muddywater/88059/
  - https://www.virustotal.com/#/file/276a765a10f98cda1a38d3a31e7483585ca3722ecad19d784441293acf1b7beb/detection
  - https://attack.mitre.org/techniques/T1059/006/

response:
  message: >
    Suspicious File Characteristics Due to Missing Fields detected on host
    $agent_name$. Matched data_win_eventdata_description:
    $data_win_eventdata_description$. Matched data_win_eventdata_fileVersion:
    $data_win_eventdata_fileVersion$. MITRE ATT&CK: T1059.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_fileVersion
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.006
  custom_tags:
    - characteristics
    - missing
    - fields
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_description:"?" AND data_win_eventdata_fileVersion:"?") OR (data_win_eventdata_description:"?" AND data_win_eventdata_product:"?") OR (data_win_eventdata_description:"?" AND data_win_eventdata_company:"?")) AND data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/
