name: Tasks Folder Evasion
id: cc4e02ba-9c06-48e2-b09e-2500cace9ae0
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cc4e02ba-9c06-48e2-b09e-2500cace9ae0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The Tasks folder in system32 and syswow64 are globally writable paths.
  Adversaries can take advantage of this and load or influence any script hosts
  or ANY .NET Application in Tasks to load and execute a custom assembly into
  cscript, wscript, regsvr32, mshta, eventvwr. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*echo *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*copy *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*type *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*file createnew*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* C:\\\\Windows\\\\System32\\\\Tasks\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* C:\\\\Windows\\\\SysWow64\\\\Tasks\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*echo
  *'; data_win_eventdata_commandLine matches '*copy *';
  data_win_eventdata_commandLine matches '*type *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/subTee/status/1216465628946563073
  - https://gist.github.com/am0nsec/8378da08f848424e4ab0cc5b317fdd26
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Tasks Folder Evasion detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - tasks
    - folder
    - evasion
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ OR data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Ll][Ee] [Cc][Rr][Ee][Aa][Tt][Ee][Nn][Ee][Ww].*/) AND (data_win_eventdata_commandLine:/.* [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_commandLine:/.* [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Tt][Aa][Ss][Kk][Ss]\\.*/)
