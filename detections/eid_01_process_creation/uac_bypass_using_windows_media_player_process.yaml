name: UAC Bypass Using Windows Media Player - Process
id: 0058b9e5-bcd7-40d4-9205-95ca5a16d7b2
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0058b9e5-bcd7-40d4-9205-95ca5a16d7b2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using Windows Media Player osksupport.dll
  (UACMe 32). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_image:
                    value: "C:\\Program Files\\Windows Media Player\\osk.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\cmd.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_parentCommandLine:
                          value: "\"C:\\Windows\\system32\\mmc.exe\" \"C:\\Windows\\system32\\eventvwr.msc\" /s"
                          case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image equals 'C:\Program
  Files\Windows Media Player\osk.exe'; data_win_eventdata_image equals
  'C:\Windows\System32\cmd.exe'; data_win_eventdata_parentCommandLine equals
  '"C:\Windows\system32\mmc.exe" "C:\Windows\system32\eventvwr.msc" /s', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using Windows Media Player - Process detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - media
    - player
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Mm][Ee][Dd][Ii][Aa] [Pp][Ll][Aa][Yy][Ee][Rr]\\[Oo][Ss][Kk]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/\"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]\" \"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Mm][Ss][Cc]\" \/[Ss]/)) AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/)
