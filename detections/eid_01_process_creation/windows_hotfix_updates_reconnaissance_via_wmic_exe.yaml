name: Windows Hotfix Updates Reconnaissance Via Wmic.EXE
id: dfd2fcb7-8bd5-4daa-b132-5adb61d6ad45
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dfd2fcb7-8bd5-4daa-b132-5adb61d6ad45
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of wmic with the "qfe" flag in order to obtain
  information about installed hotfix updates on the system. This is often used
  by pentester and attacker enumeration scripts. MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* qfe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'wmic.exe'; data_win_eventdata_image matches '*\WMIC.exe';
  data_win_eventdata_commandLine matches '* qfe*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/carlospolop/PEASS-ng/blob/fa0f2e17fbc1d86f1fd66338a40e665e7182501d/winPEAS/winPEASbat/winPEAS.bat
  - https://sushant747.gitbooks.io/total-oscp-guide/content/privilege_escalation_windows.html
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Windows Hotfix Updates Reconnaissance Via Wmic.EXE detected on host
    $agent_name$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - hotfix
    - updates
    - reconnaissance
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Qq][Ff][Ee].*/
