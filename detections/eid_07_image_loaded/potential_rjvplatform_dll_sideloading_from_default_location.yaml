name: Potential RjvPlatform.DLL Sideloading From Default Location
id: 259dda31-b7a3-444f-b7d8-17f96e8a7d0d
version: 1
schema_version: "1.0"
date: "2023-06-09"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 259dda31-b7a3-444f-b7d8-17f96e8a7d0d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects loading of "RjvPlatform.dll" by the "SystemResetPlatform.exe" binary
  which can be abused as a method of DLL side loading since the "$SysReset"
  directory isn't created by default. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\Windows\\System32\\SystemResetPlatform\\SystemResetPlatform.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_imageLoaded:
              value: "C:\\$SysReset\\Framework\\Stack\\RjvPlatform.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals
  'C:\Windows\System32\SystemResetPlatform\SystemResetPlatform.exe';
  data_win_eventdata_imageLoaded equals
  'C:\$SysReset\Framework\Stack\RjvPlatform.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1666716511988330499
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential RjvPlatform.DLL Sideloading From Default Location detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    MITRE ATT&CK: T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - rjvplatform
    - sideloading
    - default
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\\$[Ss][Yy][Ss][Rr][Ee][Ss][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\[Ss][Tt][Aa][Cc][Kk]\\[Rr][Jj][Vv][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Dd][Ll][Ll]/
