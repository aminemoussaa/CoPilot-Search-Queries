name: Malicious DLL File Dropped in the Teams or OneDrive Folder
id: 1908fcc1-1b92-4272-8214-0fbaf2fa5163
version: 1
schema_version: "1.0"
date: "2022-08-12"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1908fcc1-1b92-4272-8214-0fbaf2fa5163
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a malicious DLL file in the location where the OneDrive or
  Team applications Upon execution of the Teams or OneDrive application, the
  dropped malicious DLL file ("iphlpapi.dll") is sideloaded. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*iphlpapi.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Microsoft*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*iphlpapi.dll*'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Microsoft*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.cyble.com/2022/07/27/targeted-attacks-being-carried-out-via-dll-sideloading/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Malicious DLL File Dropped in the Teams or OneDrive Folder detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - dropped
    - teams
    - onedrive
    - file_event
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ii][Pp][Hh][Ll][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].*/
