name: Wmiexec Default Output File
id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
version: 1
schema_version: "1.0"
date: "2023-03-08"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of the default output filename used by the wmiexec tool.
  MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - regexp:
                  data_win_eventdata_targetFilename: ".*(\\\\Windows\\\\__1[0-9]{9}\\.[0-9]{1,7})"
              - regexp:
                  data_win_eventdata_targetFilename: ".*(C:\\\\__1[0-9]{9}\\.[0-9]{1,7})"
              - regexp:
                  data_win_eventdata_targetFilename: ".*(D:\\\\__1[0-9]{9}\\.[0-9]{1,7})"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches the
  regex /.*(\\Windows\\__1[0-9]{9}\.[0-9]{1,7})/;
  data_win_eventdata_targetFilename matches the regex
  /.*(C:\\__1[0-9]{9}\.[0-9]{1,7})/; data_win_eventdata_targetFilename matches
  the regex /.*(D:\\__1[0-9]{9}\.[0-9]{1,7})/.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.crowdstrike.com/blog/how-to-detect-and-prevent-impackets-wmiexec/
  - https://github.com/fortra/impacket/blob/f4b848fa27654ca95bc0f4c73dbba8b9c2c9f30a/examples/wmiexec.py
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Wmiexec Default Output File detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1047
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - wmiexec
    - default
    - output
    - file_event
    - sysmon
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*(\\Windows\\__1[0-9]{9}\.[0-9]{1,7})/ OR data_win_eventdata_targetFilename:/.*(C:\\__1[0-9]{9}\.[0-9]{1,7})/ OR data_win_eventdata_targetFilename:/.*(D:\\__1[0-9]{9}\.[0-9]{1,7})/)
