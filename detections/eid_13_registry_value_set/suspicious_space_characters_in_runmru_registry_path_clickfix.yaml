name: Suspicious Space Characters in RunMRU Registry Path - ClickFix
id: 7a1b4c5e-8f3d-4b9a-7c2e-1f4a5b8c6d9e
version: 1
schema_version: "1.0"
date: "2025-11-04"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7a1b4c5e-8f3d-4b9a-7c2e-1f4a5b8c6d9e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the occurrence of numerous space characters in RunMRU registry paths,
  which may indicate execution via phishing lures using clickfix techniques to
  hide malicious commands in the Windows Run dialog box from naked eyes. MITRE
  ATT&CK: T1204.004, T1027.010.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\RunMRU\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details: "*#*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU\*';
  data_win_eventdata_details matches '*#*'; data_win_eventdata_details matches
  '* *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://expel.com/blog/cache-smuggling-when-a-picture-isnt-a-thousand-words/
  - https://github.com/JohnHammond/recaptcha-phish
  - https://attack.mitre.org/techniques/T1204/004/
  - https://attack.mitre.org/techniques/T1027/010/

response:
  message: >
    Suspicious Space Characters in RunMRU Registry Path - ClickFix detected on
    host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1204.004, T1027.010
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.004
    - T1027.010
  custom_tags:
    - space
    - characters
    - runmru
    - registry
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn][Mm][Rr][Uu]\\.*/ AND data_win_eventdata_details:/.*\#.*/ AND (data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/)
