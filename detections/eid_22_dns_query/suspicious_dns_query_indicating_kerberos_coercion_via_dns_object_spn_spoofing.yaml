name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
version: 1
schema_version: "1.0"
date: "2025-06-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries containing patterns associated with Kerberos coercion
  attacks via DNS object spoofing. The pattern "1UWhRCAAAAA..BAAAA" is a
  base64-encoded signature that corresponds to a marshaled
  CREDENTIAL_TARGET_INFORMATION structure. Attackers can use this technique to
  coerce authentication from victim systems to attacker-controlled hosts. It is
  one of the strong indicators of a Kerberos coercion attack, where adversaries
  manipulate DNS records to spoof Service Principal Names (SPNs) and redirect
  authentication requests like CVE-2025-33073. MITRE ATT&CK: T1557.001, T1187.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_queryName:
              value: "*UWhRCA*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_queryName:
              value: "*BAAAA*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*UWhRCA*'; data_win_eventdata_queryName matches '*BAAAA*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025
  - https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html
  - https://attack.mitre.org/techniques/T1557/001/
  - https://attack.mitre.org/techniques/T1187/

response:
  message: >
    Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN
    Spoofing detected on host $agent_name$. Matched
    data_win_eventdata_queryName: $data_win_eventdata_queryName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1557.001, T1187
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.001
    - T1187
  custom_tags:
    - query
    - indicating
    - kerberos
    - dns_query
    - sysmon
    - collection
    - credential_access
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_queryName:/.*[Bb][Aa][Aa][Aa][Aa].*/
