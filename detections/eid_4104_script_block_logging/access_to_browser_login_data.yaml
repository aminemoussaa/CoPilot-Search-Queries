name: Access to Browser Login Data
id: fc028194-969d-4122-8abe-0470d5b8f12f
version: 1
schema_version: "1.0"
date: "2022-01-30"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fc028194-969d-4122-8abe-0470d5b8f12f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may acquire credentials from web browsers by reading files
  specific to the target browser. Web browsers commonly save credentials such as
  website usernames and passwords so that they do not need to be entered
  manually in the future. Web browsers typically store the credentials in an
  encrypted format within a credential store. MITRE ATT&CK: T1555.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Copy-Item*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Destination*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Opera Software\\\\Opera Stable\\\\Login Data*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Mozilla\\\\Firefox\\\\Profiles*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Microsoft\\\\Edge\\\\User Data\\\\Default*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Google\\\\Chrome\\\\User Data\\\\Default\\\\Login Data*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Google\\\\Chrome\\\\User Data\\\\Default\\\\Login Data For Account*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Copy-Item*';
  data_win_eventdata_scriptBlockText matches '*-Destination*';
  data_win_eventdata_scriptBlockText matches '*\Opera Software\Opera
  Stable\Login Data*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.003/T1555.003.md
  - https://attack.mitre.org/techniques/T1555/003/

response:
  message: >
    Access to Browser Login Data detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1555.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555.003
  custom_tags:
    - browser
    - login
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn].*/ AND (data_win_eventdata_scriptBlockText:/.*\\[Oo][Pp][Ee][Rr][Aa] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Rr][Aa] [Ss][Tt][Aa][Bb][Ll][Ee]\\[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa] [Ff][Oo][Rr] [Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/)
