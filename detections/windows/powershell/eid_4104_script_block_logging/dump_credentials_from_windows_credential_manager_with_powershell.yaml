name: Dump Credentials from Windows Credential Manager With PowerShell
id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may search for common password storage locations to obtain user
  credentials. Passwords are stored in several places on a system, depending on
  the operating system or application holding the credentials. MITRE ATT&CK:
  T1555.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-PasswordVaultCredentials*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-CredManCreds*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*New-Object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Windows.Security.Credentials.PasswordVault*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*New-Object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Microsoft.CSharp.CSharpCodeProvider*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*[System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Collections.ArrayList*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*System.CodeDom.Compiler.CompilerParameters*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-PasswordVaultCredentials*';
  data_win_eventdata_scriptBlockText matches '*Get-CredManCreds*';
  data_win_eventdata_scriptBlockText matches '*New-Object*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555/T1555.md
  - https://attack.mitre.org/techniques/T1555/

response:
  message: >
    Dump Credentials from Windows Credential Manager With PowerShell detected on
    host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1555
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555
  custom_tags:
    - credentials
    - credential
    - manager
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Rr][Ee][Dd][Mm][Aa][Nn][Cc][Rr][Ee][Dd][Ss].*/ OR (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]\.[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt].*/) OR (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Cc][Ss][Hh][Aa][Rr][Pp]\.[Cc][Ss][Hh][Aa][Rr][Pp][Cc][Oo][Dd][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Rr][Uu][Nn][Tt][Ii][Mm][Ee]\.[Ii][Nn][Tt][Ee][Rr][Oo][Pp][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Rr][Uu][Nn][Tt][Ii][Mm][Ee][Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\]::[Gg][Ee][Tt][Rr][Uu][Nn][Tt][Ii][Mm][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy]\(\)\).*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn][Ss]\.[Aa][Rr][Rr][Aa][Yy][Ll][Ii][Ss][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Cc][Oo][Dd][Ee][Dd][Oo][Mm]\.[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr][Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss].*/))
