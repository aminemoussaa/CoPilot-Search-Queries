name: Commvault QOperation Path Traversal Webshell Drop (CVE-2025-57790)
id: bd3b3fff-a018-4994-9876-68af5809160f
version: 1
schema_version: "1.0"
date: "2025-10-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bd3b3fff-a018-4994-9876-68af5809160f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of qoperation.exe with the -file argument to write a JSP file
  to the webroot, indicating a webshell drop. This is a post-authentication step
  corresponding to CVE-2025-57790. MITRE ATT&CK: T1505.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*qoperation*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*exec*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -af *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.xml *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Apache\\\\webapps\\\\ROOT\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.jsp*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*qoperation*'; data_win_eventdata_commandLine matches '*exec*';
  data_win_eventdata_commandLine matches '* -af *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.watchtowr.com/guess-who-would-be-stupid-enough-to-rob-the-same-vault-twice-pre-auth-rce-chains-in-commvault/
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    Commvault QOperation Path Traversal Webshell Drop (CVE-2025-57790) detected
    on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1505.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
  custom_tags:
    - commvault
    - qoperation
    - traversal
    - process_creation
    - sysmon
    - persistence
    - emerging_threats
    - cve_2025_57790
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Qq][Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc].*/ AND data_win_eventdata_commandLine:/.* -[Aa][Ff] .*/ AND data_win_eventdata_commandLine:/.*\.[Xx][Mm][Ll] .*/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Aa][Cc][Hh][Ee]\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\[Rr][Oo][Oo][Tt]\\.*/ AND data_win_eventdata_commandLine:/.*\.[Jj][Ss][Pp].*/
