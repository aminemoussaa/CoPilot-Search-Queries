name: HackTool - Inveigh Execution
id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Inveigh a cross-platform .NET IPv4/IPv6
  machine-in-the-middle tool. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Inveigh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "\\Inveigh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "\\Inveigh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Inveigh"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -SpooferIP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ReplyToIPs *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ReplyToDomains *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ReplyToMACs *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -SnifferIP*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Inveigh.exe'; data_win_eventdata_originalFileName equals '\Inveigh.exe';
  data_win_eventdata_originalFileName equals '\Inveigh.dll', among other
  conditions.

known_false_positives: >
  Very unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Kevin-Robertson/Inveigh
  - https://thedfirreport.com/2020/11/23/pysa-mespinoza-ransomware/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - Inveigh Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - inveigh
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_description:/[Ii][Nn][Vv][Ee][Ii][Gg][Hh]/ OR data_win_eventdata_commandLine:/.* -[Ss][Pp][Oo][Oo][Ff][Ee][Rr][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.* -[Rr][Ee][Pp][Ll][Yy][Tt][Oo][Ii][Pp][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Rr][Ee][Pp][Ll][Yy][Tt][Oo][Dd][Oo][Mm][Aa][Ii][Nn][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Rr][Ee][Pp][Ll][Yy][Tt][Oo][Mm][Aa][Cc][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Ss][Nn][Ii][Ff][Ff][Ee][Rr][Ii][Pp].*/)
