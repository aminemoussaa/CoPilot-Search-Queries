name: Potential Privilege Escalation via Service Permissions Weakness
id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Teymur Kheirkhabarov
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect modification of services configuration (ImagePath, FailureCommand and
  ServiceDLL) in registry by processes with Medium integrity level. MITRE
  ATT&CK: T1574.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "Medium"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-8192"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ControlSet*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*services*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ImagePath*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\FailureCommand*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ServiceDll*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_integrityLevel equals
  'Medium'; data_win_eventdata_integrityLevel equals 'S-1-16-8192';
  data_win_eventdata_commandLine matches '*ControlSet*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
  - https://pentestlab.blog/2017/03/31/insecure-registry-permissions/
  - https://attack.mitre.org/techniques/T1574/011/

response:
  message: >
    Potential Privilege Escalation via Service Permissions Weakness detected on
    host $agent_name$. Matched data_win_eventdata_integrityLevel:
    $data_win_eventdata_integrityLevel$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1574.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_integrityLevel
      type: other
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.011
  custom_tags:
    - privilege
    - escalation
    - service
    - process_creation
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_integrityLevel:/[Mm][Ee][Dd][Ii][Uu][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-8192/) AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss].*/ AND (data_win_eventdata_commandLine:/.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*\\[Ff][Aa][Ii][Ll][Uu][Rr][Ee][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll].*/)
