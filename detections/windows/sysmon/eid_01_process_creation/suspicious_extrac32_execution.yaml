name: Suspicious Extrac32 Execution
id: aa8e035d-7be4-48d3-a944-102aec04400d
version: 1
schema_version: "1.0"
date: "2022-08-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa8e035d-7be4-48d3-a944-102aec04400d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Download or Copy file with Extrac32. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*extrac32.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\extrac32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "extrac32.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.cab*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/C*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/Y*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine: "* \\\\\\\\*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*extrac32.exe*'; data_win_eventdata_image matches '*\extrac32.exe';
  data_win_eventdata_originalFileName equals 'extrac32.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Extrac32/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Suspicious Extrac32 Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - extrac32
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Xx][Tt][Rr][Aa][Cc]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Tt][Rr][Aa][Cc]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ee][Xx][Tt][Rr][Aa][Cc]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\.[Cc][Aa][Bb].*/ AND (data_win_eventdata_commandLine:/.*\/[Cc].*/ OR data_win_eventdata_commandLine:/.*\/[Yy].*/ OR data_win_eventdata_commandLine:/.* \\\\.*/)
