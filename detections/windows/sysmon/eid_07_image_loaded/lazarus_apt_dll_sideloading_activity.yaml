name: Lazarus APT DLL Sideloading Activity
id: 24007168-a26b-4049-90d0-ce138e13a5cf
version: 1
schema_version: "1.0"
date: "2023-10-18"
author: Thurein Oo, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 24007168-a26b-4049-90d0-ce138e13a5cf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects sideloading of trojanized DLLs used in Lazarus APT campaign in the
  case of a Spanish aerospace company. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\ProgramShared\\PresentationHost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_imageLoaded:
                          value: ":\\ProgramShared\\mscoree.dll"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\ProgramData\\Adobe\\colorcpl.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\ProgramData\\Adobe\\colorui.dll"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\ProgramData\\Oracle\\Java\\fixmapi.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\ProgramData\\Oracle\\Java\\mapistub.dll"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\ProgramData\\Adobe\\ARM\\tabcal.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\ProgramData\\Adobe\\ARM\\HID.dll"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals
  'C:\ProgramShared\PresentationHost.exe'; data_win_eventdata_imageLoaded equals
  ':\ProgramShared\mscoree.dll'; data_win_eventdata_image equals
  'C:\ProgramData\Adobe\colorcpl.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.welivesecurity.com/en/eset-research/lazarus-luring-employees-trojanized-coding-challenges-case-spanish-aerospace-company/
  - https://www.bleepingcomputer.com/news/security/lazarus-hackers-breach-aerospace-firm-with-new-lightlesscan-malware/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Lazarus APT DLL Sideloading Activity detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - lazarus
    - sideloading
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss][Hh][Aa][Rr][Ee][Dd]\\[Pp][Rr][Ee][Ss][Ee][Nn][Tt][Aa][Tt][Ii][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss][Hh][Aa][Rr][Ee][Dd]\\[Mm][Ss][Cc][Oo][Rr][Ee][Ee]\.[Dd][Ll][Ll]/) OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Cc][Oo][Ll][Oo][Rr][Cc][Pp][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Cc][Oo][Ll][Oo][Rr][Uu][Ii]\.[Dd][Ll][Ll]/) OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Oo][Rr][Aa][Cc][Ll][Ee]\\[Jj][Aa][Vv][Aa]\\[Ff][Ii][Xx][Mm][Aa][Pp][Ii]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Oo][Rr][Aa][Cc][Ll][Ee]\\[Jj][Aa][Vv][Aa]\\[Mm][Aa][Pp][Ii][Ss][Tt][Uu][Bb]\.[Dd][Ll][Ll]/) OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Aa][Rr][Mm]\\[Tt][Aa][Bb][Cc][Aa][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Aa][Rr][Mm]\\[Hh][Ii][Dd]\.[Dd][Ll][Ll]/))
