name: Unsigned Mfdetours.DLL Sideloading
id: 948a0953-f287-4806-bbcb-3b2e396df89f
version: 1
schema_version: "1.0"
date: "2023-08-11"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 948a0953-f287-4806-bbcb-3b2e396df89f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DLL sideloading of unsigned "mfdetours.dll". Executing "mftrace.exe"
  can be abused to attach to an arbitrary process and force load any DLL named
  "mfdetours.dll" from the current directory of execution. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\mfdetours.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - exists:
            field: "data_win_eventdata_signatureStatus"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*:\\\\Program Files (x86)\\\\Windows Kits\\\\10\\\\bin\\\\*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_signatureStatus:
                          value: "Valid"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signatureStatus
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\mfdetours.dll'; data_win_eventdata_imageLoaded matches '*:\Program Files
  (x86)\Windows Kits\10\bin\*'; data_win_eventdata_signatureStatus equals
  'Valid'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Unsigned Mfdetours.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_signatureStatus: $data_win_eventdata_signatureStatus$.
    MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_signatureStatus
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - unsigned
    - mfdetours
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Mm][Ff][Dd][Ee][Tt][Oo][Uu][Rr][Ss]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND _exists_:data_win_eventdata_signatureStatus AND NOT (data_win_eventdata_imageLoaded:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Kk][Ii][Tt][Ss]\\10\\[Bb][Ii][Nn]\\.*/ AND data_win_eventdata_signatureStatus:/[Vv][Aa][Ll][Ii][Dd]/)
