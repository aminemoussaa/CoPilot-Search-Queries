name: Potential Credential Dumping Attempt Via PowerShell Remote Thread
id: fb656378-f909-47c1-8747-278bf09f4f4f
version: 1
schema_version: "1.0"
date: "2022-12-18"
author: oscd.community, Natalia Shornikova
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fb656378-f909-47c1-8747-278bf09f4f4f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects remote thread creation by PowerShell processes into "lsass.exe". MITRE
  ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_sourceImage matches '*\powershell.exe';
  data_win_eventdata_sourceImage matches '*\pwsh.exe';
  data_win_eventdata_targetImage matches '*\lsass.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential Credential Dumping Attempt Via PowerShell Remote Thread detected
    on host $agent_name$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_sourceImage
      type: process
    - field: data_win_eventdata_targetImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - credential
    - dumping
    - powershell
    - create_remote_thread
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"8" AND (data_win_eventdata_sourceImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
