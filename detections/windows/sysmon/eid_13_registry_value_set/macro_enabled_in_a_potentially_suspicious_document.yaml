name: Macro Enabled In A Potentially Suspicious Document
id: a166f74e-bf44-409d-b9ba-ea4b2dd8b3cd
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a166f74e-bf44-409d-b9ba-ea4b2dd8b3cd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry changes to Office trust records where the path is located in
  a potentially suspicious location. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Security\\\\Trusted Documents\\\\TrustRecords*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*/AppData/Local/Microsoft/Windows/INetCache/*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*/AppData/Local/Temp/*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*/PerfLogs/*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*C:/Users/Public/*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*file:///D:/*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*file:///E:/*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Security\Trusted Documents\TrustRecords*'; data_win_eventdata_targetObject
  matches '*/AppData/Local/Microsoft/Windows/INetCache/*';
  data_win_eventdata_targetObject matches '*/AppData/Local/Temp/*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/inversecos/status/1494174785621819397
  - Internal Research
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Macro Enabled In A Potentially Suspicious Document detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - macro
    - document
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Tt][Rr][Uu][Ss][Tt][Ee][Dd] [Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]\\[Tt][Rr][Uu][Ss][Tt][Rr][Ee][Cc][Oo][Rr][Dd][Ss].*/ AND (data_win_eventdata_targetObject:/.*\/[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\/[Ll][Oo][Cc][Aa][Ll]\/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\/[Ii][Nn][Ee][Tt][Cc][Aa][Cc][Hh][Ee]\/.*/ OR data_win_eventdata_targetObject:/.*\/[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\/[Ll][Oo][Cc][Aa][Ll]\/[Tt][Ee][Mm][Pp]\/.*/ OR data_win_eventdata_targetObject:/.*\/[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\/.*/ OR data_win_eventdata_targetObject:/.*[Cc]:\/[Uu][Ss][Ee][Rr][Ss]\/[Pp][Uu][Bb][Ll][Ii][Cc]\/.*/ OR data_win_eventdata_targetObject:/.*[Ff][Ii][Ll][Ee]:\/\/\/[Dd]:\/.*/ OR data_win_eventdata_targetObject:/.*[Ff][Ii][Ll][Ee]:\/\/\/[Ee]:\/.*/)
